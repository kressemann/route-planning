# Zentrale Artikelklassifizierung fuer die Tourenplanung.
#
# Klassifizierungs-Prioritaet (siehe article_rules.py):
#   a) explizite Overrides (dieser Datei)
#   b) Zoho-Custom-Field "Produktart" = Schnittware
#   c) "Gartenkresse" im Namen           -> KRESSE      (1 VE = 12 Stk.)
#   d) "1/9" im Namen                    -> EINZEL_1_9   (1 Kiste = 9 Stk.)
#   e) Grammangabe im Namen (z.B. "200g") -> SCHNITTWARE
#   f) "Stk." im Namen                   -> SCHNITTWARE
#   g) "Mix" im Namen                    -> KOMPLETTE_VE (9 Stk. je VE, 1
#                                            bestellte Einheit = 1 Kiste).
#                                            Schnittware (b, e, f) sowie
#                                            Kresse (c) und 1/9 (d) haben
#                                            Vorrang, falls beides zutrifft.
#   h) sonst                             -> UNKLASSIFIZIERT
#
# Overrides matchen als Teilstring, gross-/kleinschreibungsunabhaengig, gegen
# den Artikelnamen. Sie werden vor allen anderen Regeln geprueft.

overrides:
  - match: "Shira Mix"
    class: KOMPLETTE_VE
  - match: "Sakina Mix"
    class: KOMPLETTE_VE
  - match: "Steige"
    class: KOMPLETTE_VE
  - match: "Gartenkresse 1/12 Schale/Pad"
    class: KRESSE
  - match: "Oxalis Mix 15 Stk."
    class: SCHNITTWARE

# Name des Zoho-Custom-Fields am Artikel (Item), das die Produktart traegt.
produktart_custom_field_label: "Produktart"
produktart_schnittware_value: "Schnittware"

# Verpackungseinheiten je Klasse.
ve_groesse:
  EINZEL_1_9: 9
  KRESSE: 12
