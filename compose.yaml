# Eingebunden in das zentrale Automation Center: erreichbar ueber Caddy unter
# https://automation.kressemann.de/tourenplanung (Basic Auth des Automation
# Centers). Kein Host-Port mehr - die App ist nur ueber das interne Docker-
# Netz "automation-network" fuer Caddy erreichbar.
#
#   docker compose run --rm tests    89+ Tests, ohne Netz
#   docker compose up -d web         App im Netz automation-network
#
# Zugangsdaten kommen aus der lokalen .env (siehe .env.example) oder aus der
# Shell-Umgebung - stehen nie im Image oder in dieser Datei.

services:
  web:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: route-planning:latest
    container_name: route-planning
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID:-}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET:-}
      ZOHO_REFRESH_TOKEN: ${ZOHO_REFRESH_TOKEN:-}
      ZOHO_ORGANIZATION_ID: ${ZOHO_ORGANIZATION_ID:-}
      ZOHO_REGION: ${ZOHO_REGION:-eu}
      GSMTASKS_API_KEY: ${GSMTASKS_API_KEY:-}
      # Fester Fahrer fuer neu uebertragene Stopps (kein Secret). User-UUID
      # aus GET /account_roles/ (Rolle "Kressemann", is_worker) - NICHT einer
      # der Integrations-Benutzer mit Vorname "Kressemann". Der Anzeigename
      # wird vor jeder Uebertragung lesend gegen GSMtasks geprueft.
      GSMTASKS_ASSIGNEE_USER_ID: b47e7f7c-6e71-436c-8305-e7a0b6b2e1f9
      GSMTASKS_ASSIGNEE_NAME: Kressemann
      TZ: Europe/Berlin
    volumes:
      # Muss dem Benutzer aus UID/GID gehoeren, sonst schlaegt das Schreiben
      # der SQLite-Datei fehl: mkdir -p data && chown $(id -u):$(id -g) data
      - ./data:/app/data
    networks:
      - automation-network

  tests:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: route-planning:latest
    entrypoint: ["python", "-m", "pytest", "tests", "-q"]
    environment:
      TZ: Europe/Berlin
    # Belegt, dass die Testsuite offline laeuft: ohne Netz, ohne echte
    # Zoho-Zugangsdaten, keine Schreibzugriffe.
    network_mode: none

  # Logik der Weboberflaeche (static/ordering.js, static/totals.js):
  #   docker compose run --rm tests-js
  tests-js:
    image: node:20-alpine
    working_dir: /app
    entrypoint: ["node", "--test", "tests/js/"]
    volumes:
      - ./routeplanning/static:/app/routeplanning/static:ro
      - ./tests/js:/app/tests/js:ro
    network_mode: none
    profiles: ["tests"]

networks:
  automation-network:
    external: true
